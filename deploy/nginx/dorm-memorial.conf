limit_req_zone $binary_remote_addr zone=dorm_auth:10m rate=10r/m;

server {
    listen 80;
    server_name memorial.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name memorial.example.com;

    ssl_certificate /etc/letsencrypt/live/memorial.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorial.example.com/privkey.pem;

    client_max_body_size 16m;
    server_tokens off;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=dorm_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
