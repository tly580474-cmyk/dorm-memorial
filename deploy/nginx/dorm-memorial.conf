limit_req_zone $binary_remote_addr zone=dorm_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=dorm_upload:10m;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

server {
    listen 80;
    server_name 3048.clical.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 3048.clical.xin;

    ssl_certificate /etc/letsencrypt/live/3048.clical.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3048.clical.xin/privkey.pem;

    client_max_body_size 8g;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=dorm_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/media/uploads {
        limit_conn dorm_upload 2;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
