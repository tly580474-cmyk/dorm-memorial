/* Dorm Memorial Community — Design Tokens */
/* Source: uploaded design system MASTER.md + FRONTEND_LAYOUT.md */

:root {
  /* Primitive palette — light mode (default) */
  --dmc-bg: #F7F3EA;
  --dmc-surface: #FFFCF6;
  --dmc-surface-raised: #FFFFFF;
  --dmc-text: #2F2A24;
  --dmc-text-muted: #6F665C;
  --dmc-primary: #9A452F;
  --dmc-primary-hover: #7E3524;
  --dmc-primary-ink: #FFFFFF;
  --dmc-secondary: #3F6F6A;
  --dmc-secondary-ink: #FFFFFF;
  --dmc-highlight: #C3923E;
  --dmc-border: #DED5C7;
  --dmc-success: #39734F;
  --dmc-danger: #A13D3D;

  /* Semantic aliases required by apply-html-head-contract */
  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-primary-foreground: var(--dmc-primary-ink);
  --dmc-secondary-foreground: var(--dmc-secondary-ink);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);

  /* Radius scale */
  --dmc-radius-small: 6px;
  --dmc-radius-medium: 10px;
  --dmc-radius-large: 14px;
  --dmc-radius-full: 9999px;

  /* Shadows */
  --dmc-shadow-sm: 0 1px 2px rgba(55, 45, 35, 0.06);
  --dmc-shadow-md: 0 8px 24px rgba(55, 45, 35, 0.09);
  --dmc-shadow-overlay: 0 20px 56px rgba(30, 25, 20, 0.18);

  /* Typography */
  --dmc-font-display: "Noto Serif SC", "Songti SC", STSong, serif;
  --dmc-font-body: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;

  /* Spacing */
  --dmc-space-1: 4px;
  --dmc-space-2: 8px;
  --dmc-space-3: 12px;
  --dmc-space-4: 16px;
  --dmc-space-5: 24px;
  --dmc-space-6: 32px;
  --dmc-space-7: 48px;

  /* Layout */
  --dmc-sidebar-width: 224px;
  --dmc-sidebar-compact: 72px;
  --dmc-right-rail-width: 280px;
  --dmc-topbar-height: 64px;
  --dmc-mobile-topbar-height: 56px;
  --dmc-mobile-bottomnav-height: 64px;
  --dmc-content-max: 1440px;
  --dmc-feed-max: 760px;
}

html.dark {
  --dmc-bg: #1E1B18;
  --dmc-surface: #29241F;
  --dmc-surface-raised: #342E28;
  --dmc-text: #F6EFE5;
  --dmc-text-muted: #C4B9AC;
  --dmc-primary: #E58A70;
  --dmc-primary-hover: #F1A087;
  --dmc-primary-ink: #1E1B18;
  --dmc-secondary: #78AAA4;
  --dmc-secondary-ink: #1E1B18;
  --dmc-highlight: #DDB566;
  --dmc-border: #4A423A;
  --dmc-success: #73B98C;
  --dmc-danger: #E17C7C;

  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);
}

/* Typography utilities */
.font-display { font-family: var(--dmc-font-display); }
.font-body { font-family: var(--dmc-font-body); }

/* Static film grain — use sparingly on empty/login/hero states */
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

<body class="font-body antialiased">

<!-- Desktop shared shell for Dorm Memorial Community -->
<!-- TOPBAR START -->
<header class="fixed top-0 left-0 right-0 h-16 bg-card/80 backdrop-blur border-b border-border z-40">
  <div class="max-w-[1440px] mx-auto h-full flex items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <span class="w-8 h-8 rounded-lg bg-primary text-primary-foreground flex items-center justify-center font-display text-lg">舍</span>
      <span class="font-display text-xl text-foreground">305 纪念社区</span>
    </div>
    <div class="flex items-center gap-4">
      <button class="w-10 h-10 rounded-full hover:bg-muted flex items-center justify-center" aria-label="搜索" data-dom-id="global-search"><i data-lucide="search" class="w-5 h-5 text-muted-foreground"></i></button>
      <button class="w-10 h-10 rounded-full hover:bg-muted flex items-center justify-center" aria-label="通知" data-dom-id="global-notifications"><i data-lucide="bell" class="w-5 h-5 text-muted-foreground"></i></button>
      <button class="w-9 h-9 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-sm font-medium" aria-label="个人菜单">小</button>
    </div>
  </div>
</header>
<!-- TOPBAR END -->

<!-- SIDEBAR START -->
<aside class="fixed top-16 left-0 bottom-0 w-56 bg-card border-r border-border z-30 hidden lg:flex flex-col">
  <nav class="flex-1 p-3 space-y-1" aria-label="主导航">
    <a href="index.html" data-nav-key="home" data-dom-id="nav-home" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-foreground hover:bg-muted transition-colors"><i data-lucide="home" class="w-5 h-5"></i><span>首页</span></a>
    <a href="wall.html" data-nav-key="wall" data-dom-id="nav-wall" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-foreground hover:bg-muted transition-colors"><i data-lucide="image" class="w-5 h-5"></i><span>照片墙</span></a>
    <a href="forum.html" data-nav-key="forum" data-dom-id="nav-forum" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-foreground hover:bg-muted transition-colors"><i data-lucide="messages-square" class="w-5 h-5"></i><span>论坛</span></a>
    <a href="messages.html" data-nav-key="messages" data-dom-id="nav-messages" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-foreground hover:bg-muted transition-colors"><i data-lucide="message-circle" class="w-5 h-5"></i><span>消息</span></a>
    <a href="guestbook.html" data-nav-key="guestbook" data-dom-id="nav-guestbook" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-foreground hover:bg-muted transition-colors"><i data-lucide="book-heart" class="w-5 h-5"></i><span>个人留言</span></a>
  </nav>
  <div class="p-3 border-t border-border">
    <a href="composer.html" class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-md bg-primary text-primary-foreground font-medium hover:bg-primary-hover transition-colors" data-dom-id="global-create" aria-current="page"><i data-lucide="plus" class="w-4 h-4"></i><span>发布回忆</span></a>
  </div>
</aside>
<!-- SIDEBAR END -->

<!-- RIGHTRAIL FRAME START -->
<aside class="fixed top-16 right-0 bottom-0 w-[280px] bg-card border-l border-border z-30 hidden xl:block p-5 space-y-5" data-region="rightrail">
  <div class="rounded-[10px] border border-dashed border-border p-4 text-center">
    <p class="text-sm text-muted-foreground">专注于此刻的回忆</p>
  </div>
</aside>
<!-- RIGHTRAIL FRAME END -->

<main class="desktop-main pt-16 lg:pl-56 xl:pr-[280px] min-h-screen bg-background">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 py-8">
    <section class="bg-card border border-border rounded-[14px] p-6 sm:p-8 shadow-sm" aria-labelledby="composer-title">
      <div class="flex items-center justify-between mb-6">
        <h1 id="composer-title" class="font-display text-2xl text-foreground">发布回忆</h1>
        <a href="index.html" class="inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground transition-colors" data-dom-id="composer-cancel">
          <i data-lucide="x" class="w-4 h-4"></i>
          <span>取消</span>
        </a>
      </div>

      <div class="space-y-6">
        <div>
          <label for="composer-text" class="sr-only">回忆内容</label>
          <textarea
            id="composer-text"
            data-dom-id="composer-text"
            rows="8"
            class="w-full resize-none rounded-[10px] border border-border bg-[var(--dmc-surface-raised)] px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow"
            placeholder="写下你想纪念的宿舍故事..."
          ></textarea>
        </div>

        <div data-dom-id="composer-media">
          <p class="text-sm font-medium text-foreground mb-3">添加照片或视频</p>
          <div class="grid grid-cols-3 gap-3">
            <button type="button" class="group relative aspect-square rounded-[10px] border-2 border-dashed border-border hover:border-primary flex flex-col items-center justify-center gap-2 transition-colors">
              <i data-lucide="image-plus" class="w-6 h-6 text-muted-foreground group-hover:text-primary transition-colors"></i>
              <span class="text-xs text-muted-foreground">添加</span>
            </button>
            <div class="relative aspect-square rounded-[10px] border border-border bg-muted/50 overflow-hidden">
              <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="image" class="w-7 h-7 text-muted-foreground/60"></i>
              </div>
              <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-border">
                <div class="h-full bg-primary w-3/4"></div>
              </div>
              <span class="absolute bottom-2 right-2 text-[10px] text-muted-foreground bg-card/80 px-1.5 rounded">75%</span>
            </div>
            <div class="relative aspect-square rounded-[10px] border border-border bg-muted/50 overflow-hidden">
              <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="image" class="w-7 h-7 text-muted-foreground/60"></i>
              </div>
              <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-border">
                <div class="h-full bg-primary w-full"></div>
              </div>
              <span class="absolute bottom-2 right-2 text-[10px] text-muted-foreground bg-card/80 px-1.5 rounded">100%</span>
            </div>
          </div>
        </div>

        <div>
          <button
            type="button"
            data-dom-id="composer-more"
            class="w-full flex items-center justify-between rounded-[10px] border border-border px-4 py-3 text-sm text-foreground hover:bg-muted/50 transition-colors"
            aria-expanded="false"
          >
            <span class="flex items-center gap-2">
              <i data-lucide="settings-2" class="w-4 h-4 text-muted-foreground"></i>
              更多设置
            </span>
            <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
          </button>
          <div class="hidden mt-3 rounded-[10px] border border-border p-4 bg-[var(--dmc-surface-raised)] space-y-3">
            <label class="flex items-center justify-between text-sm text-foreground">
              <span>允许评论</span>
              <input type="checkbox" checked class="accent-primary h-4 w-4 rounded border-border">
            </label>
            <label class="flex items-center justify-between text-sm text-foreground">
              <span>同步到照片墙</span>
              <input type="checkbox" checked class="accent-primary h-4 w-4 rounded border-border">
            </label>
          </div>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            data-dom-id="composer-submit"
            class="w-full inline-flex items-center justify-center gap-2 rounded-[10px] bg-primary px-6 py-3 text-base font-medium text-primary-foreground hover:bg-primary-hover transition-colors"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
            发布
          </button>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
  lucide.createIcons();
</script>

</body>
