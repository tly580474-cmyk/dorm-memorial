<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布</title>
    <style id="theme-vars">
/* Dorm Memorial Community — Design Tokens */
/* Source: uploaded design system MASTER.md + FRONTEND_LAYOUT.md */

:root {
  /* Primitive palette — light mode (default) */
  --dmc-bg: #F7F3EA;
  --dmc-surface: #FFFCF6;
  --dmc-surface-raised: #FFFFFF;
  --dmc-text: #2F2A24;
  --dmc-text-muted: #6F665C;
  --dmc-primary: #9A452F;
  --dmc-primary-hover: #7E3524;
  --dmc-primary-ink: #FFFFFF;
  --dmc-secondary: #3F6F6A;
  --dmc-secondary-ink: #FFFFFF;
  --dmc-highlight: #C3923E;
  --dmc-border: #DED5C7;
  --dmc-success: #39734F;
  --dmc-danger: #A13D3D;

  /* Semantic aliases required by apply-html-head-contract */
  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-primary-foreground: var(--dmc-primary-ink);
  --dmc-secondary-foreground: var(--dmc-secondary-ink);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);

  /* Radius scale */
  --dmc-radius-small: 6px;
  --dmc-radius-medium: 10px;
  --dmc-radius-large: 14px;
  --dmc-radius-full: 9999px;

  /* Shadows */
  --dmc-shadow-sm: 0 1px 2px rgba(55, 45, 35, 0.06);
  --dmc-shadow-md: 0 8px 24px rgba(55, 45, 35, 0.09);
  --dmc-shadow-overlay: 0 20px 56px rgba(30, 25, 20, 0.18);

  /* Typography */
  --dmc-font-display: "Noto Serif SC", "Songti SC", STSong, serif;
  --dmc-font-body: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;

  /* Spacing */
  --dmc-space-1: 4px;
  --dmc-space-2: 8px;
  --dmc-space-3: 12px;
  --dmc-space-4: 16px;
  --dmc-space-5: 24px;
  --dmc-space-6: 32px;
  --dmc-space-7: 48px;

  /* Layout */
  --dmc-sidebar-width: 224px;
  --dmc-sidebar-compact: 72px;
  --dmc-right-rail-width: 280px;
  --dmc-topbar-height: 64px;
  --dmc-mobile-topbar-height: 56px;
  --dmc-mobile-bottomnav-height: 64px;
  --dmc-content-max: 1440px;
  --dmc-feed-max: 760px;
}

html.dark {
  --dmc-bg: #1E1B18;
  --dmc-surface: #29241F;
  --dmc-surface-raised: #342E28;
  --dmc-text: #F6EFE5;
  --dmc-text-muted: #C4B9AC;
  --dmc-primary: #E58A70;
  --dmc-primary-hover: #F1A087;
  --dmc-primary-ink: #1E1B18;
  --dmc-secondary: #78AAA4;
  --dmc-secondary-ink: #1E1B18;
  --dmc-highlight: #DDB566;
  --dmc-border: #4A423A;
  --dmc-success: #73B98C;
  --dmc-danger: #E17C7C;

  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);
}

/* Typography utilities */
.font-display { font-family: var(--dmc-font-display); }
.font-body { font-family: var(--dmc-font-body); }

/* Static film grain — use sparingly on empty/login/hero states */
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--dmc-background);
    --color-foreground: var(--dmc-foreground);
    --color-card: var(--dmc-card);
    --color-card-foreground: var(--dmc-card-foreground);
    --color-popover: var(--dmc-popover);
    --color-popover-foreground: var(--dmc-popover-foreground);
    --color-primary: var(--dmc-primary);
    --color-primary-foreground: var(--dmc-primary-foreground);
    --color-secondary: var(--dmc-secondary);
    --color-secondary-foreground: var(--dmc-secondary-foreground);
    --color-muted: var(--dmc-muted);
    --color-muted-foreground: var(--dmc-muted-foreground);
    --color-border: var(--dmc-border);
    --color-input: var(--dmc-input);
    --color-ring: var(--dmc-ring);
    --radius-sm: var(--dmc-radius-small);
    --radius-md: var(--dmc-radius-medium);
    --radius-lg: var(--dmc-radius-large);
  }
  @layer base {
    body { background: var(--dmc-background); color: var(--dmc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--dmc-background); }
      .text-background { color: var(--dmc-background); }
      .border-background { border-color: var(--dmc-background); }
      .ring-background { --tw-ring-color: var(--dmc-background); }
      .bg-foreground { background-color: var(--dmc-foreground); }
      .text-foreground { color: var(--dmc-foreground); }
      .border-foreground { border-color: var(--dmc-foreground); }
      .ring-foreground { --tw-ring-color: var(--dmc-foreground); }
      .bg-card { background-color: var(--dmc-card); }
      .text-card { color: var(--dmc-card); }
      .border-card { border-color: var(--dmc-card); }
      .ring-card { --tw-ring-color: var(--dmc-card); }
      .bg-card-foreground { background-color: var(--dmc-card-foreground); }
      .text-card-foreground { color: var(--dmc-card-foreground); }
      .border-card-foreground { border-color: var(--dmc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--dmc-card-foreground); }
      .bg-popover { background-color: var(--dmc-popover); }
      .text-popover { color: var(--dmc-popover); }
      .border-popover { border-color: var(--dmc-popover); }
      .ring-popover { --tw-ring-color: var(--dmc-popover); }
      .bg-popover-foreground { background-color: var(--dmc-popover-foreground); }
      .text-popover-foreground { color: var(--dmc-popover-foreground); }
      .border-popover-foreground { border-color: var(--dmc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--dmc-popover-foreground); }
      .bg-primary { background-color: var(--dmc-primary); }
      .text-primary { color: var(--dmc-primary); }
      .border-primary { border-color: var(--dmc-primary); }
      .ring-primary { --tw-ring-color: var(--dmc-primary); }
      .bg-primary-foreground { background-color: var(--dmc-primary-foreground); }
      .text-primary-foreground { color: var(--dmc-primary-foreground); }
      .border-primary-foreground { border-color: var(--dmc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--dmc-primary-foreground); }
      .bg-secondary { background-color: var(--dmc-secondary); }
      .text-secondary { color: var(--dmc-secondary); }
      .border-secondary { border-color: var(--dmc-secondary); }
      .ring-secondary { --tw-ring-color: var(--dmc-secondary); }
      .bg-secondary-foreground { background-color: var(--dmc-secondary-foreground); }
      .text-secondary-foreground { color: var(--dmc-secondary-foreground); }
      .border-secondary-foreground { border-color: var(--dmc-secondary-foreground); }
      .ring-secondary-foreground { --tw-ring-color: var(--dmc-secondary-foreground); }
      .bg-muted { background-color: var(--dmc-muted); }
      .text-muted { color: var(--dmc-muted); }
      .border-muted { border-color: var(--dmc-muted); }
      .ring-muted { --tw-ring-color: var(--dmc-muted); }
      .bg-muted-foreground { background-color: var(--dmc-muted-foreground); }
      .text-muted-foreground { color: var(--dmc-muted-foreground); }
      .border-muted-foreground { border-color: var(--dmc-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--dmc-muted-foreground); }
      .bg-border { background-color: var(--dmc-border); }
      .text-border { color: var(--dmc-border); }
      .border-border { border-color: var(--dmc-border); }
      .ring-border { --tw-ring-color: var(--dmc-border); }
      .bg-input { background-color: var(--dmc-input); }
      .text-input { color: var(--dmc-input); }
      .border-input { border-color: var(--dmc-input); }
      .ring-input { --tw-ring-color: var(--dmc-input); }
      .bg-ring { background-color: var(--dmc-ring); }
      .text-ring { color: var(--dmc-ring); }
      .border-ring { border-color: var(--dmc-ring); }
      .ring-ring { --tw-ring-color: var(--dmc-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="bg-background font-body text-foreground antialiased">

  <!-- MOBILE TOPBAR START -->
  <header class="sticky top-0 left-0 right-0 h-14 bg-card/95 border-b border-border z-40">
    <div class="max-w-md mx-auto h-full flex items-center justify-between px-4">
      <span class="font-display text-lg text-foreground">305 纪念社区</span>
      <div class="flex items-center gap-2">
        <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="搜索" data-dom-id="global-search"><i data-lucide="search" class="w-5 h-5 text-muted-foreground"></i></button>
        <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="通知" data-dom-id="global-notifications"><i data-lucide="bell" class="w-5 h-5 text-muted-foreground"></i></button>
      </div>
    </div>
  </header>
  <!-- MOBILE TOPBAR END -->

  <main class="mobile-main bg-background">
    <div class="max-w-md mx-auto px-4">

      <!-- Composer top bar -->
      <div class="flex items-center justify-between py-4 border-b border-border">
        <a href="index.html" class="inline-flex min-w-11 h-11 items-center justify-center text-sm text-muted-foreground hover:text-primary transition-colors" data-dom-id="composer-cancel">
          取消
        </a>
        <h1 class="font-display text-lg text-foreground">发布回忆</h1>
        <span class="w-10"></span>
      </div>

      <!-- Post composer -->
      <section class="mt-4">
        <label for="composer-text" class="sr-only">回忆内容</label>
        <textarea
          id="composer-text"
          data-dom-id="composer-text"
          class="composer-textarea w-full bg-surface border border-border rounded-lg p-4 text-base text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"
          placeholder="写下你想纪念的寝室回忆……"
        ></textarea>
      </section>

      <!-- Media upload list -->
      <section class="mt-5" data-dom-id="composer-media">
        <h2 class="text-sm font-medium text-muted-foreground mb-3">媒体上传</h2>
        <div class="space-y-3">
          <!-- Upload item 1 -->
          <div class="flex items-center gap-3 bg-surface border border-border rounded-lg p-3">
            <div class="w-12 h-12 rounded-md bg-muted flex items-center justify-center shrink-0 min-w-[48px]">
              <i data-lucide="image" class="w-6 h-6 text-muted-foreground"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm text-foreground truncate">寝室合影_2024.jpg</p>
              <p class="text-xs text-muted-foreground mt-0.5">2.4 MB · 78%</p>
              <div class="progress-bar mt-2">
                <span style="width: 78%;"></span>
              </div>
            </div>
            <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center shrink-0" aria-label="移除文件">
              <i data-lucide="x" class="w-4 h-4 text-muted-foreground"></i>
            </button>
          </div>

          <!-- Upload item 2 -->
          <div class="flex items-center gap-3 bg-surface border border-border rounded-lg p-3">
            <div class="w-12 h-12 rounded-md bg-muted flex items-center justify-center shrink-0 min-w-[48px]">
              <i data-lucide="video" class="w-6 h-6 text-muted-foreground"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm text-foreground truncate">毕业视频_clip.mp4</p>
              <p class="text-xs text-muted-foreground mt-0.5">18.6 MB · 45%</p>
              <div class="progress-bar mt-2">
                <span style="width: 45%;"></span>
              </div>
            </div>
            <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center shrink-0" aria-label="移除文件">
              <i data-lucide="x" class="w-4 h-4 text-muted-foreground"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Submit -->
      <div class="mt-6">
        <button
          type="button"
          data-dom-id="composer-submit"
          class="w-full h-12 rounded-lg bg-primary text-primary-foreground font-medium text-base hover:bg-primary-hover transition-colors"
        >
          发布
        </button>
      </div>

    </div>
  </main>

  <!-- MOBILE BOTTOM NAV START -->
  
  <!-- MOBILE BOTTOM NAV END -->

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      lucide.createIcons();
    });
  </script>

    <style id="critical-layout">
    .mobile-main {
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--dmc-mobile-topbar-height, 56px);
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
    .composer-textarea {
      min-height: 160px;
      resize: none;
    }
    .progress-bar {
      height: 4px;
      border-radius: var(--dmc-radius-full, 9999px);
      overflow: hidden;
      background: var(--dmc-border);
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--dmc-primary);
      transition: width 0.3s ease;
    }
    .bg-surface { background-color: var(--dmc-surface); }
    .bg-primary-hover { background-color: var(--dmc-primary-hover); }
    .hover\:bg-primary-hover:hover { background-color: var(--dmc-primary-hover); }
  </style>
</body>
</html>
