<!DOCTYPE html>

    <style id="theme-vars">
/* Dorm Memorial Community — Design Tokens */
/* Source: uploaded design system MASTER.md + FRONTEND_LAYOUT.md */

:root {
  /* Primitive palette — light mode (default) */
  --dmc-bg: #F7F3EA;
  --dmc-surface: #FFFCF6;
  --dmc-surface-raised: #FFFFFF;
  --dmc-text: #2F2A24;
  --dmc-text-muted: #6F665C;
  --dmc-primary: #9A452F;
  --dmc-primary-hover: #7E3524;
  --dmc-primary-ink: #FFFFFF;
  --dmc-secondary: #3F6F6A;
  --dmc-secondary-ink: #FFFFFF;
  --dmc-highlight: #C3923E;
  --dmc-border: #DED5C7;
  --dmc-success: #39734F;
  --dmc-danger: #A13D3D;

  /* Semantic aliases required by apply-html-head-contract */
  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-primary-foreground: var(--dmc-primary-ink);
  --dmc-secondary-foreground: var(--dmc-secondary-ink);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);

  /* Radius scale */
  --dmc-radius-small: 6px;
  --dmc-radius-medium: 10px;
  --dmc-radius-large: 14px;
  --dmc-radius-full: 9999px;

  /* Shadows */
  --dmc-shadow-sm: 0 1px 2px rgba(55, 45, 35, 0.06);
  --dmc-shadow-md: 0 8px 24px rgba(55, 45, 35, 0.09);
  --dmc-shadow-overlay: 0 20px 56px rgba(30, 25, 20, 0.18);

  /* Typography */
  --dmc-font-display: "Noto Serif SC", "Songti SC", STSong, serif;
  --dmc-font-body: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;

  /* Spacing */
  --dmc-space-1: 4px;
  --dmc-space-2: 8px;
  --dmc-space-3: 12px;
  --dmc-space-4: 16px;
  --dmc-space-5: 24px;
  --dmc-space-6: 32px;
  --dmc-space-7: 48px;

  /* Layout */
  --dmc-sidebar-width: 224px;
  --dmc-sidebar-compact: 72px;
  --dmc-right-rail-width: 280px;
  --dmc-topbar-height: 64px;
  --dmc-mobile-topbar-height: 56px;
  --dmc-mobile-bottomnav-height: 64px;
  --dmc-content-max: 1440px;
  --dmc-feed-max: 760px;
}

html.dark {
  --dmc-bg: #1E1B18;
  --dmc-surface: #29241F;
  --dmc-surface-raised: #342E28;
  --dmc-text: #F6EFE5;
  --dmc-text-muted: #C4B9AC;
  --dmc-primary: #E58A70;
  --dmc-primary-hover: #F1A087;
  --dmc-primary-ink: #1E1B18;
  --dmc-secondary: #78AAA4;
  --dmc-secondary-ink: #1E1B18;
  --dmc-highlight: #DDB566;
  --dmc-border: #4A423A;
  --dmc-success: #73B98C;
  --dmc-danger: #E17C7C;

  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);
}

/* Typography utilities */
.font-display { font-family: var(--dmc-font-display); }
.font-body { font-family: var(--dmc-font-body); }

/* Static film grain — use sparingly on empty/login/hero states */
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

    </style>

    <style type="text/tailwindcss">

    --color-card-foreground: var(--dmc-card-foreground);
    --color-popover: var(--dmc-popover);
    --color-popover-foreground: var(--dmc-popover-foreground);
    --color-primary: var(--dmc-primary);
    --color-primary-foreground: var(--dmc-primary-foreground);
    --color-secondary: var(--dmc-secondary);
    --color-secondary-foreground: var(--dmc-secondary-foreground);
    --color-muted: var(--dmc-muted);
    --color-muted-foreground: var(--dmc-muted-foreground);
    --color-border: var(--dmc-border);
    --color-input: var(--dmc-input);
    --color-ring: var(--dmc-ring);
    --radius-sm: var(--dmc-radius-small);

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

      .text-primary { color: var(--dmc-primary); }

      .bg-muted { background-color: var(--dmc-muted); }
      .text-muted { color: var(--dmc-muted); }
      .border-muted { border-color: var(--dmc-muted); }
      .ring-muted { --tw-ring-color: var(--dmc-muted); }

<body class="min-h-screen font-sans antialiased bg-background text-foreground">

<!-- Mobile shared shell for Dorm Memorial Community -->
<!-- MOBILE TOPBAR START -->
<header class="sticky top-0 left-0 right-0 h-14 bg-card/95 border-b border-border z-40">
  <div class="max-w-md mx-auto h-full flex items-center justify-between px-4">
    <span class="font-display text-lg text-foreground">305 纪念社区</span>
    <div class="flex items-center gap-2">
      <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="搜索" data-dom-id="global-search"><i data-lucide="search" class="w-5 h-5 text-muted-foreground"></i></button>
      <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="通知" data-dom-id="global-notifications"><i data-lucide="bell" class="w-5 h-5 text-muted-foreground"></i></button>
    </div>
  </div>
</header>
<!-- MOBILE TOPBAR END -->

<main class="mobile-main bg-background">
  <div class="max-w-md mx-auto px-4">

    <div class="py-5 flex items-center justify-between">
      <h1 class="font-display text-2xl text-foreground">照片墙</h1>
      <button data-dom-id="filter-sheet-trigger" class="inline-flex items-center gap-1 rounded-full border border-border bg-surface px-3 py-1.5 text-sm text-foreground hover:bg-surface-raised transition-colors">
        全部
        <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
      </button>
    </div>

    <section class="masonry-grid" aria-label="宿舍回忆照片">
      <article class="masonry-item bg-surface rounded-[var(--dmc-radius-medium,10px)] overflow-hidden shadow-sm">
        <img src="../assets/dorm-memory-1.jpg" alt="宿舍回忆 1" loading="lazy">
        <div class="p-2.5">
          <p class="text-sm text-foreground leading-snug">阳台的午后阳光</p>
          <p class="text-xs text-muted-foreground mt-1">@小雅</p>
        </div>
      </article>

      <article class="masonry-item bg-surface rounded-[var(--dmc-radius-medium,10px)] overflow-hidden shadow-sm">
        <img src="../assets/dorm-memory-2.jpg" alt="宿舍回忆 2" loading="lazy">
        <div class="p-2.5">
          <p class="text-sm text-foreground leading-snug">考前夜宵局</p>
          <p class="text-xs text-muted-foreground mt-1">@阿楠</p>
        </div>
      </article>

      <article class="masonry-item bg-surface rounded-[var(--dmc-radius-medium,10px)] overflow-hidden shadow-sm">
        <img src="../assets/dorm-memory-3.jpg" alt="宿舍回忆 3" loading="lazy">
        <div class="p-2.5">
          <p class="text-sm text-foreground leading-snug">生日惊喜现场</p>
          <p class="text-xs text-muted-foreground mt-1">@默默</p>
        </div>
      </article>

      <article class="masonry-item bg-surface rounded-[var(--dmc-radius-medium,10px)] overflow-hidden shadow-sm">
        <img src="../assets/dorm-memory-4.jpg" alt="宿舍回忆 4" loading="lazy">
        <div class="p-2.5">
          <p class="text-sm text-foreground leading-snug">毕业前最后一晚</p>
          <p class="text-xs text-muted-foreground mt-1">@室友全体</p>
        </div>
      </article>
    </section>

  </div>
</main>

<!-- MOBILE BOTTOM NAV START -->
<nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50 pb-[env(safe-area-inset-bottom)]">
  <div class="w-full max-w-md mx-auto grid grid-cols-5 h-16">
    <a href="index.html" data-nav-key="home" data-dom-id="nav-home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a>
    <a href="wall.html" data-nav-key="wall" data-dom-id="nav-wall" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="image" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">照片</span></a>
    <a href="composer.html" data-nav-key="create" data-dom-id="nav-create" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><span class="w-11 h-11 rounded-full bg-primary text-primary-foreground flex items-center justify-center"><i data-lucide="plus" class="w-5 h-5 shrink-0"></i></span><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">发布</span></a>
    <a href="forum.html" data-nav-key="forum" data-dom-id="nav-forum" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="messages-square" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">论坛</span></a>
    <a href="chat.html" data-nav-key="messages" data-dom-id="nav-messages" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="message-circle" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">消息</span></a>
  </div>
</nav>
<!-- MOBILE BOTTOM NAV END -->

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>

    <style id="critical-layout">
    .masonry-grid {
      column-count: 2;
      column-gap: 0.75rem;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 0.75rem;
    }
    .masonry-item img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--dmc-radius-medium, 10px);
    }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      [data-mobile-nav="global"] { padding-bottom: env(safe-area-inset-bottom); }
      .mobile-main { padding-bottom: calc(var(--dmc-mobile-bottomnav-height, 64px) + env(safe-area-inset-bottom)); }
    }
  </style>
</body>
