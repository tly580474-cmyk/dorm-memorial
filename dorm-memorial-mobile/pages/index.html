<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>

    <style id="theme-vars">
/* Dorm Memorial Community — Design Tokens */
/* Source: uploaded design system MASTER.md + FRONTEND_LAYOUT.md */

:root {
  /* Primitive palette — light mode (default) */
  --dmc-bg: #F7F3EA;
  --dmc-surface: #FFFCF6;
  --dmc-surface-raised: #FFFFFF;
  --dmc-text: #2F2A24;
  --dmc-text-muted: #6F665C;
  --dmc-primary: #9A452F;
  --dmc-primary-hover: #7E3524;
  --dmc-primary-ink: #FFFFFF;
  --dmc-secondary: #3F6F6A;
  --dmc-secondary-ink: #FFFFFF;
  --dmc-highlight: #C3923E;
  --dmc-border: #DED5C7;
  --dmc-success: #39734F;
  --dmc-danger: #A13D3D;

  /* Semantic aliases required by apply-html-head-contract */
  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-primary-foreground: var(--dmc-primary-ink);
  --dmc-secondary-foreground: var(--dmc-secondary-ink);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);

  /* Radius scale */
  --dmc-radius-small: 6px;
  --dmc-radius-medium: 10px;
  --dmc-radius-large: 14px;
  --dmc-radius-full: 9999px;

  /* Shadows */
  --dmc-shadow-sm: 0 1px 2px rgba(55, 45, 35, 0.06);
  --dmc-shadow-md: 0 8px 24px rgba(55, 45, 35, 0.09);
  --dmc-shadow-overlay: 0 20px 56px rgba(30, 25, 20, 0.18);

  /* Typography */
  --dmc-font-display: "Noto Serif SC", "Songti SC", STSong, serif;
  --dmc-font-body: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;

  /* Spacing */
  --dmc-space-1: 4px;
  --dmc-space-2: 8px;
  --dmc-space-3: 12px;
  --dmc-space-4: 16px;
  --dmc-space-5: 24px;
  --dmc-space-6: 32px;
  --dmc-space-7: 48px;

  /* Layout */
  --dmc-sidebar-width: 224px;
  --dmc-sidebar-compact: 72px;
  --dmc-right-rail-width: 280px;
  --dmc-topbar-height: 64px;
  --dmc-mobile-topbar-height: 56px;
  --dmc-mobile-bottomnav-height: 64px;
  --dmc-content-max: 1440px;
  --dmc-feed-max: 760px;
}

html.dark {
  --dmc-bg: #1E1B18;
  --dmc-surface: #29241F;
  --dmc-surface-raised: #342E28;
  --dmc-text: #F6EFE5;
  --dmc-text-muted: #C4B9AC;
  --dmc-primary: #E58A70;
  --dmc-primary-hover: #F1A087;
  --dmc-primary-ink: #1E1B18;
  --dmc-secondary: #78AAA4;
  --dmc-secondary-ink: #1E1B18;
  --dmc-highlight: #DDB566;
  --dmc-border: #4A423A;
  --dmc-success: #73B98C;
  --dmc-danger: #E17C7C;

  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);
}

/* Typography utilities */
.font-display { font-family: var(--dmc-font-display); }
.font-body { font-family: var(--dmc-font-body); }

/* Static film grain — use sparingly on empty/login/hero states */
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

    --color-background: var(--dmc-background);
    --color-foreground: var(--dmc-foreground);
    --color-card: var(--dmc-card);
    --color-card-foreground: var(--dmc-card-foreground);
    --color-popover: var(--dmc-popover);
    --color-popover-foreground: var(--dmc-popover-foreground);
    --color-primary: var(--dmc-primary);
    --color-primary-foreground: var(--dmc-primary-foreground);
    --color-secondary: var(--dmc-secondary);
    --color-secondary-foreground: var(--dmc-secondary-foreground);
    --color-muted: var(--dmc-muted);
    --color-muted-foreground: var(--dmc-muted-foreground);
    --color-border: var(--dmc-border);
    --color-input: var(--dmc-input);
    --color-ring: var(--dmc-ring);

  @layer base {

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

      .ring-muted { --tw-ring-color: var(--dmc-muted); }

<body class="min-h-screen font-sans antialiased bg-background text-foreground">
  <style id="critical-layout">
    .mobile-main { min-height: calc(100vh - 3.5rem - 4rem); }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      [data-mobile-nav="global"] { padding-bottom: env(safe-area-inset-bottom); }
      .mobile-main { padding-bottom: calc(var(--dmc-mobile-bottomnav-height, 64px) + env(safe-area-inset-bottom)); }
    }
  </style>

  <!-- MOBILE TOPBAR START -->
  <header class="sticky top-0 left-0 right-0 h-14 bg-card/95 border-b border-border z-40">
    <div class="max-w-md mx-auto h-full flex items-center justify-between px-4">
      <span class="font-display text-lg text-foreground">305 纪念社区</span>
      <div class="flex items-center gap-2">
        <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="搜索" data-dom-id="global-search"><i data-lucide="search" class="w-5 h-5 text-muted-foreground"></i></button>
        <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="通知" data-dom-id="global-notifications"><i data-lucide="bell" class="w-5 h-5 text-muted-foreground"></i></button>
      </div>
    </div>
  </header>
  <!-- MOBILE TOPBAR END -->

  <main class="mobile-main bg-background">
    <div class="max-w-md mx-auto px-4 py-4 space-y-5">
      <!-- Greeting Hero -->
      <section class="relative overflow-hidden rounded-[14px] border border-border bg-card shadow-sm">
        <div class="relative h-40 w-full overflow-hidden">
          <img src="../assets/dorm-hero.jpg" alt="305 宿舍纪念社区" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
        </div>
        <div class="p-4">
          <h1 class="font-display text-xl text-foreground leading-tight">欢迎回到 305 纪念社区</h1>
          <p class="mt-1.5 text-sm text-muted-foreground leading-relaxed">这里珍藏着我们共同的宿舍记忆，随时可以翻阅、记录与分享。</p>
        </div>
      </section>

      <!-- Quick Composer -->
      <section data-dom-id="composer-trigger" class="rounded-[14px] border border-border bg-card p-4 shadow-sm active:scale-[0.99] transition-transform cursor-pointer">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center shrink-0">
            <i data-lucide="pen-line" class="w-5 h-5"></i>
          </div>
          <div class="flex-1">
            <p class="text-sm text-foreground">今天想记录点什么？</p>
            <p class="text-xs text-muted-foreground mt-0.5">写下一段回忆、上传一张照片或发表心情</p>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-muted-foreground shrink-0"></i>
        </div>
        <div class="mt-3 flex items-center gap-4 border-t border-border pt-3">
          <button class="flex items-center gap-1.5 text-xs text-muted-foreground hover:text-primary transition-colors">
            <i data-lucide="image" class="w-4 h-4"></i>
            <span>照片</span>
          </button>
          <button class="flex items-center gap-1.5 text-xs text-muted-foreground hover:text-primary transition-colors">
            <i data-lucide="video" class="w-4 h-4"></i>
            <span>视频</span>
          </button>
          <button class="flex items-center gap-1.5 text-xs text-muted-foreground hover:text-primary transition-colors">
            <i data-lucide="smile" class="w-4 h-4"></i>
            <span>心情</span>
          </button>
        </div>
      </section>

      <!-- Recent Memories Feed -->
      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-display text-base text-foreground">最近回忆</h2>
          <a href="wall.html" class="text-xs text-primary hover:underline">查看全部</a>
        </div>

        <!-- Post 1 -->
        <article class="rounded-[14px] border border-border bg-card p-4 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-sm font-medium">林</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-foreground truncate">林小北</p>
              <p class="text-xs text-muted-foreground">2 小时前</p>
            </div>
          </div>
          <p class="mt-3 text-sm text-foreground leading-relaxed">那天半夜一起煮泡面的场景还历历在目，305 的小厨房永远弥漫着老坛酸菜的味道。</p>
          <div class="mt-3 grid grid-cols-2 gap-2 rounded-[10px] overflow-hidden border border-border">
            <img src="../assets/dorm-memory-1.jpg" alt="宿舍回忆 1" class="w-full h-32 object-cover">
            <img src="../assets/dorm-memory-2.jpg" alt="宿舍回忆 2" class="w-full h-32 object-cover">
          </div>
          <div class="mt-3 flex items-center gap-5 text-muted-foreground">
            <button class="flex items-center gap-1 text-xs hover:text-primary transition-colors">
              <i data-lucide="heart" class="w-4 h-4"></i>
              <span>12</span>
            </button>
            <button class="flex items-center gap-1 text-xs hover:text-primary transition-colors">
              <i data-lucide="message-square" class="w-4 h-4"></i>
              <span>3</span>
            </button>
            <button class="flex items-center gap-1 text-xs hover:text-primary transition-colors ml-auto">
              <i data-lucide="share-2" class="w-4 h-4"></i>
              <span>分享</span>
            </button>
          </div>
        </article>

        <!-- Post 2 -->
        <article class="rounded-[14px] border border-border bg-card p-4 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-highlight text-white flex items-center justify-center text-sm font-medium">周</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-foreground truncate">周阿宁</p>
              <p class="text-xs text-muted-foreground">昨天</p>
            </div>
          </div>
          <p class="mt-3 text-sm text-foreground leading-relaxed">翻出了毕业时大家在阳台拍的合影，阳光正好，我们笑得一脸傻气。</p>
          <div class="mt-3 rounded-[10px] overflow-hidden border border-border">
            <img src="../assets/dorm-memory-2.jpg" alt="宿舍回忆 3" class="w-full h-44 object-cover">
          </div>
          <div class="mt-3 flex items-center gap-5 text-muted-foreground">
            <button class="flex items-center gap-1 text-xs hover:text-primary transition-colors">
              <i data-lucide="heart" class="w-4 h-4"></i>
              <span>28</span>
            </button>
            <button class="flex items-center gap-1 text-xs hover:text-primary transition-colors">
              <i data-lucide="message-square" class="w-4 h-4"></i>
              <span>7</span>
            </button>
            <button class="flex items-center gap-1 text-xs hover:text-primary transition-colors ml-auto">
              <i data-lucide="share-2" class="w-4 h-4"></i>
              <span>分享</span>
            </button>
          </div>
        </article>
      </section>
    </div>
  </main>

  <!-- MOBILE BOTTOM NAV START -->
  <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50 pb-[env(safe-area-inset-bottom)]">
  <div class="w-full max-w-md mx-auto grid grid-cols-5 h-16">
    <a href="index.html" data-nav-key="home" data-dom-id="nav-home" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a>
    <a href="wall.html" data-nav-key="wall" data-dom-id="nav-wall" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="image" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">照片</span></a>
    <a href="composer.html" data-nav-key="create" data-dom-id="nav-create" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><span class="w-11 h-11 rounded-full bg-primary text-primary-foreground flex items-center justify-center"><i data-lucide="plus" class="w-5 h-5 shrink-0"></i></span><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">发布</span></a>
    <a href="forum.html" data-nav-key="forum" data-dom-id="nav-forum" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="messages-square" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">论坛</span></a>
    <a href="chat.html" data-nav-key="messages" data-dom-id="nav-messages" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-foreground hover:text-primary transition-colors"><i data-lucide="message-circle" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">消息</span></a>
  </div>
</nav>
  <!-- MOBILE BOTTOM NAV END -->

  <script>lucide.createIcons();</script>
</body>
</html>
