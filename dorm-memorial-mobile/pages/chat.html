    <style id="theme-vars">
/* Dorm Memorial Community — Design Tokens */
/* Source: uploaded design system MASTER.md + FRONTEND_LAYOUT.md */

:root {
  /* Primitive palette — light mode (default) */
  --dmc-bg: #F7F3EA;
  --dmc-surface: #FFFCF6;
  --dmc-surface-raised: #FFFFFF;
  --dmc-text: #2F2A24;
  --dmc-text-muted: #6F665C;
  --dmc-primary: #9A452F;
  --dmc-primary-hover: #7E3524;
  --dmc-primary-ink: #FFFFFF;
  --dmc-secondary: #3F6F6A;
  --dmc-secondary-ink: #FFFFFF;
  --dmc-highlight: #C3923E;
  --dmc-border: #DED5C7;
  --dmc-success: #39734F;
  --dmc-danger: #A13D3D;

  /* Semantic aliases required by apply-html-head-contract */
  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-primary-foreground: var(--dmc-primary-ink);
  --dmc-secondary-foreground: var(--dmc-secondary-ink);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);

  /* Radius scale */
  --dmc-radius-small: 6px;
  --dmc-radius-medium: 10px;
  --dmc-radius-large: 14px;
  --dmc-radius-full: 9999px;

  /* Shadows */
  --dmc-shadow-sm: 0 1px 2px rgba(55, 45, 35, 0.06);
  --dmc-shadow-md: 0 8px 24px rgba(55, 45, 35, 0.09);
  --dmc-shadow-overlay: 0 20px 56px rgba(30, 25, 20, 0.18);

  /* Typography */
  --dmc-font-display: "Noto Serif SC", "Songti SC", STSong, serif;
  --dmc-font-body: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;

  /* Spacing */
  --dmc-space-1: 4px;
  --dmc-space-2: 8px;
  --dmc-space-3: 12px;
  --dmc-space-4: 16px;
  --dmc-space-5: 24px;
  --dmc-space-6: 32px;
  --dmc-space-7: 48px;

  /* Layout */
  --dmc-sidebar-width: 224px;
  --dmc-sidebar-compact: 72px;
  --dmc-right-rail-width: 280px;
  --dmc-topbar-height: 64px;
  --dmc-mobile-topbar-height: 56px;
  --dmc-mobile-bottomnav-height: 64px;
  --dmc-content-max: 1440px;
  --dmc-feed-max: 760px;
}

html.dark {
  --dmc-bg: #1E1B18;
  --dmc-surface: #29241F;
  --dmc-surface-raised: #342E28;
  --dmc-text: #F6EFE5;
  --dmc-text-muted: #C4B9AC;
  --dmc-primary: #E58A70;
  --dmc-primary-hover: #F1A087;
  --dmc-primary-ink: #1E1B18;
  --dmc-secondary: #78AAA4;
  --dmc-secondary-ink: #1E1B18;
  --dmc-highlight: #DDB566;
  --dmc-border: #4A423A;
  --dmc-success: #73B98C;
  --dmc-danger: #E17C7C;

  --dmc-background: var(--dmc-bg);
  --dmc-foreground: var(--dmc-text);
  --dmc-card: var(--dmc-surface);
  --dmc-card-foreground: var(--dmc-text);
  --dmc-popover: var(--dmc-surface-raised);
  --dmc-popover-foreground: var(--dmc-text);
  --dmc-muted: var(--dmc-border);
  --dmc-muted-foreground: var(--dmc-text-muted);
  --dmc-input: var(--dmc-border);
  --dmc-ring: var(--dmc-primary);
}

/* Typography utilities */
.font-display { font-family: var(--dmc-font-display); }
.font-body { font-family: var(--dmc-font-body); }

/* Static film grain — use sparingly on empty/login/hero states */
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

    </style>

    <style type="text/tailwindcss">

    --color-primary-foreground: var(--dmc-primary-foreground);

    --color-muted-foreground: var(--dmc-muted-foreground);
    --color-border: var(--dmc-border);
    --color-input: var(--dmc-input);

    th { @apply whitespace-nowrap; }
  }

<body class="min-h-screen font-sans antialiased bg-background text-foreground">
  <style id="critical-layout">
    .mobile-main { min-height: calc(100vh - 3.5rem); }
    .composer-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .composer-bar { padding-bottom: env(safe-area-inset-bottom); }
      .mobile-main { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); /* chat composer bar + safe area */ }
    }
  </style>

  <!-- MOBILE TOPBAR START -->
  <header class="sticky top-0 left-0 right-0 h-14 bg-card/95 border-b border-border z-40">
    <div class="max-w-md mx-auto h-full flex items-center px-4 gap-3">
      <a href="index.html" data-dom-id="back-messages" class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center shrink-0" aria-label="返回">
        <i data-lucide="chevron-left" class="w-5 h-5 text-muted-foreground"></i>
      </a>
      <div class="w-9 h-9 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-sm font-medium shrink-0">305</div>
      <div class="flex-1 min-w-0">
        <h1 class="font-display text-base text-foreground truncate">宿舍群聊</h1>
        <p class="text-xs text-muted-foreground truncate">4 人在线</p>
      </div>
      <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center" aria-label="更多" data-dom-id="chat-more">
        <i data-lucide="more-horizontal" class="w-5 h-5 text-muted-foreground"></i>
      </button>
    </div>
  </header>
  <!-- MOBILE TOPBAR END -->

  <main class="mobile-main pb-24 bg-background">
    <div class="max-w-md mx-auto px-4 py-4 space-y-4">

      <!-- Date divider -->
      <div class="flex items-center justify-center">
        <span class="text-[11px] text-muted-foreground bg-muted/50 px-3 py-1 rounded-full">今天 14:32</span>
      </div>

      <!-- Incoming message -->
      <div class="flex items-end gap-2">
        <div class="w-8 h-8 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-xs font-medium shrink-0">林</div>
        <div class="max-w-[72%] space-y-1">
          <div class="rounded-t-[12px] rounded-br-[12px] rounded-bl-[4px] bg-card border border-border px-3.5 py-2.5 shadow-sm">
            <p class="text-sm text-foreground leading-relaxed">刚才翻到一张大二那年元旦晚会的照片，阿宁站在最边上笑得特别傻。</p>
          </div>
          <span class="text-[10px] text-muted-foreground pl-1">14:33</span>
        </div>
      </div>

      <!-- Outgoing message -->
      <div class="flex items-end gap-2 justify-end">
        <div class="max-w-[72%] space-y-1 text-right">
          <div class="rounded-t-[12px] rounded-bl-[12px] rounded-br-[4px] bg-primary text-primary-foreground px-3.5 py-2.5 shadow-sm">
            <p class="text-sm leading-relaxed">哈哈，我记得那天他非要戴那个红围巾，结果拍照的时候掉地上了。</p>
          </div>
          <span class="text-[10px] text-muted-foreground pr-1">14:34</span>
        </div>
        <div class="w-11 h-11 rounded-full bg-highlight text-white flex items-center justify-center text-xs font-medium shrink-0">我</div>
      </div>

      <!-- Incoming message -->
      <div class="flex items-end gap-2">
        <div class="w-8 h-8 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-xs font-medium shrink-0">周</div>
        <div class="max-w-[72%] space-y-1">
          <div class="rounded-t-[12px] rounded-br-[12px] rounded-bl-[4px] bg-card border border-border px-3.5 py-2.5 shadow-sm">
            <p class="text-sm text-foreground leading-relaxed">我这里有完整的合影，晚点上传到照片墙。</p>
          </div>
          <span class="text-[10px] text-muted-foreground pl-1">14:36</span>
        </div>
      </div>

      <!-- Incoming message with image -->
      <div class="flex items-end gap-2">
        <div class="w-8 h-8 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-xs font-medium shrink-0">林</div>
        <div class="max-w-[72%] space-y-1">
          <div class="rounded-t-[12px] rounded-br-[12px] rounded-bl-[4px] bg-card border border-border p-2 shadow-sm">
            <img src="../assets/dorm-memory-3.jpg" alt="宿舍回忆" class="w-full h-40 object-cover rounded-lg">
          </div>
          <span class="text-[10px] text-muted-foreground pl-1">14:37</span>
        </div>
      </div>

      <!-- Outgoing message -->
      <div class="flex items-end gap-2 justify-end">
        <div class="max-w-[72%] space-y-1 text-right">
          <div class="rounded-t-[12px] rounded-bl-[12px] rounded-br-[4px] bg-primary text-primary-foreground px-3.5 py-2.5 shadow-sm">
            <p class="text-sm leading-relaxed">太好了！这张照片光线真好，大家都笑得很开心。</p>
          </div>
          <span class="text-[10px] text-muted-foreground pr-1">14:38</span>
        </div>
        <div class="w-11 h-11 rounded-full bg-highlight text-white flex items-center justify-center text-xs font-medium shrink-0">我</div>
      </div>

      <!-- Incoming message -->
      <div class="flex items-end gap-2">
        <div class="w-11 h-11 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center text-xs font-medium shrink-0">张</div>
        <div class="max-w-[72%] space-y-1">
          <div class="rounded-t-[12px] rounded-br-[12px] rounded-bl-[4px] bg-card border border-border px-3.5 py-2.5 shadow-sm">
            <p class="text-sm text-foreground leading-relaxed">下次聚会我们把这张照片打印出来挂墙上吧。</p>
          </div>
          <span class="text-[10px] text-muted-foreground pl-1">14:40</span>
        </div>
      </div>

      <!-- Outgoing message -->
      <div class="flex items-end gap-2 justify-end">
        <div class="max-w-[72%] space-y-1 text-right">
          <div class="rounded-t-[12px] rounded-bl-[12px] rounded-br-[4px] bg-primary text-primary-foreground px-3.5 py-2.5 shadow-sm">
            <p class="text-sm leading-relaxed">赞成！就挂在 305 进门右手边，原来的位置。</p>
          </div>
          <span class="text-[10px] text-muted-foreground pr-1">14:41</span>
        </div>
        <div class="w-11 h-11 rounded-full bg-highlight text-white flex items-center justify-center text-xs font-medium shrink-0">我</div>
      </div>

    </div>
  

</main>

  <!-- Message Composer -->
  <div class="composer-bar bg-card border-t border-border pb-[env(safe-area-inset-bottom)]">
    <div class="max-w-md mx-auto px-3 py-3 flex items-end gap-2">
      <button class="w-11 h-11 rounded-full hover:bg-muted flex items-center justify-center shrink-0" aria-label="添加附件">
        <i data-lucide="plus-circle" class="w-5 h-5 text-muted-foreground"></i>
      </button>
      <div class="flex-1 min-w-0">
        <textarea data-dom-id="message-input" rows="1" placeholder="输入消息..." aria-label="消息输入" class="w-full resize-none max-h-28 rounded-[18px] border border-border bg-background px-4 py-2.5 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/30" style="min-height: 40px;"></textarea>
      </div>
      <button data-dom-id="message-send" class="w-11 h-11 rounded-full bg-primary text-primary-foreground flex items-center justify-center shrink-0 hover:bg-primary-hover transition-colors" aria-label="发送">
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
